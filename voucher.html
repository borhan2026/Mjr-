<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voucher</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--paper:#fff;--ink:#1d2430;--mute:#5b6675;--line:#d5dae1;--head:#6aaa40;--r1:#e6efdc;--r2:#dce8f4;--tot:#dfe3f7;--blue:#244a8f;--vbg:#e0e4f6;--vink:#1b2a8a;--date:#8a4a1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151a;--paper:#1c2128;--ink:#e8ebf0;--mute:#9aa5b4;--line:#38404b;--head:#4d8a2c;--r1:#25301f;--r2:#1f2b3a;--tot:#262c4a;--blue:#8fb0ee;--vbg:#262c4a;--vink:#aab6ff;--date:#e0a070}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI","Noto Sans Bengali",system-ui,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#000;color:#fff;position:relative;z-index:5}
.bar b{font-size:17px}
.dots{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 10px;cursor:pointer;border-radius:8px}
.menu{position:absolute;right:10px;top:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;overflow:hidden}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--r2);outline:0}
.sheet{max-width:780px;margin:14px auto;background:var(--paper);padding:20px;border-radius:6px}
.top{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:14px;min-width:0}
#logo{width:64px;height:64px;object-fit:contain;border-radius:50%;cursor:pointer;flex:none}
.stamp{font:italic 700 30px Georgia,serif;background:var(--vbg);color:var(--vink);padding:6px 22px}
.lbl{font-size:12px;color:var(--mute)}
.f{background:none;border:0;border-bottom:1px dashed transparent;color:inherit;font:inherit;padding:1px 0;width:100%;min-width:0}
.f:hover,.f:focus{border-bottom-color:var(--mute);outline:0}
.nm{font-weight:600;font-size:18px}.sm{font-size:13px}
.meta{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;flex-wrap:wrap}
.meta>div{flex:1 1 220px}
.mr{display:flex;align-items:center;gap:8px;margin-left:auto;max-width:260px}
.mr span{width:70px}.mr .f{text-align:right;font-size:17px}
.dt{color:var(--date)}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--head);color:#fff;font-weight:400;padding:6px 8px;text-align:center;font-size:16px}
th:first-child{text-align:left}th:last-child{text-align:right}
td{padding:8px;vertical-align:middle;border:1px solid rgba(120,140,110,.35)}
tr.r:nth-child(odd) td{background:var(--r1)}tr.r:nth-child(even) td{background:var(--r2)}
td textarea{resize:none;overflow:hidden}
.t{font-weight:700;font-size:17px}
.c{text-align:center}.a{text-align:right}
.q{width:60px;text-align:center}.rt{width:110px;text-align:center}.am{width:110px;text-align:right}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px;margin-top:4px}
.sum{margin:14px 0 0 auto;width:min(320px,100%);border-collapse:collapse;min-width:0}
.sum td{border:1px solid var(--line);color:var(--blue);font-size:18px;padding:4px 10px;background:none}
.sum tr:nth-child(even) td{background:var(--tot)}
.sum td:last-child{text-align:right}.sum input{text-align:right;color:var(--blue);font-size:18px}
.sum tr:nth-child(2) td{font-weight:700}
.add{margin-top:10px;padding:8px 14px;border:1px solid var(--line);background:none;color:inherit;border-radius:8px;cursor:pointer;font:inherit}
.pb{margin-left:auto;background:#fff;color:#000;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:20}.dlg.on{display:grid}
.dlg>div{background:var(--paper);padding:18px;border-radius:12px;width:min(340px,90%)}
.dlg h3{margin:0 0 12px;font-size:18px}.dlg label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
.dlg select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.dlg .bt{display:flex;gap:8px;margin-top:16px}.dlg .bt button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
.dlg .bt .go{background:var(--head);border-color:var(--head);color:#fff;font-weight:600}
#pcopy{display:none}.pv{display:block;white-space:pre-wrap;word-break:break-word}
.ctag{font-size:12px;color:var(--mute);text-align:right;margin-bottom:4px}
@media print{
:root:root:root{color-scheme:light;--bg:#fff;--paper:#fff;--ink:#000;--mute:#444;--line:#999;--head:#6aaa40;--r1:#e6efdc;--r2:#dce8f4;--tot:#dfe3f7;--blue:#244a8f;--vbg:#e0e4f6;--vink:#1b2a8a;--date:#8a4a1c}
body{background:#fff}.bar,.add,.x,.dlg,.menu{display:none!important}
.sheet{margin:0;max-width:none;padding:0;border-radius:0}.f{border:0!important}
.tw{overflow:visible}table{min-width:0}
tr.r td,th,.stamp,.sum td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.pc>.sheet{display:none}body.pc #pcopy{display:block}
#pcopy .sheet{break-inside:avoid;margin-bottom:8mm;padding-bottom:8mm;border-bottom:1px dashed #888}
#pcopy .sheet:last-child{border-bottom:0}
}
</style>
</head>
<body>
<div class="bar">
  <b>Voucher</b>
  <button class="pb" id="pbtn">🖨 Print</button>
  <button class="dots" id="dots" aria-label="Menu">⋮</button>
  <div class="menu" id="menu">
    <button id="mLogo">Set logo</button>
    <button id="mDel">Remove logo</button>
    <button id="mAdd">Add item</button>
    <button id="mPrint">Print / Save PDF</button>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<style id="pstyle"></style>
<div class="dlg" id="pdlg"><div>
  <h3>Print voucher</h3>
  <label for="psize">Paper size</label>
  <select id="psize"><option value="A4">A4</option><option value="A5">A5</option><option value="Letter">Letter</option></select>
  <label for="pcopies">Copies</label>
  <select id="pcopies"><option value="1">1 copy</option><option value="2">2 copies (Office + Party)</option></select>
  <div class="bt"><button id="pcancel">Cancel</button><button class="go" id="pgo">Print</button></div>
</div></div>

<div class="sheet">
  <div class="top">
    <div class="who">
      <img id="logo" alt="Logo" title="Tap to change logo">
      <div>
        <div class="sm">FROM</div>
        <input class="f nm" id="from" value="MM Jalaluddin Rumi">
        <input class="f sm" id="fromRole" value="Assistant Teacher">
      </div>
    </div>
    <div class="stamp">Voucher</div>
  </div>

  <div class="meta">
    <div>
      <div class="sm">VOUCHER TO</div>
      <input class="f nm" id="to" value="Mufti Nur Muhammad">
      <input class="f sm" id="toRole" value="Founder &amp; Principal">
    </div>
    <div>
      <div class="mr"><span>Receipt:</span><input class="f" id="rno" value="00003"></div>
      <div class="mr"><span>Date:</span><input class="f dt" id="date" value="12.11.2026"></div>
    </div>
  </div>

  <div class="tw">
    <table>
      <thead><tr><th>Description</th><th>QTY</th><th>Rate</th><th>Amount</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button class="add" id="add">+ Add item</button>

  <table class="sum">
    <tr><td>Total</td><td id="total">0.00</td></tr>
    <tr><td>Advance</td><td><input class="f" id="adv" value="2000"></td></tr>
    <tr><td>Paid</td><td id="paid">0.00</td></tr>
    <tr><td>Return</td><td id="ret">0.00</td></tr>
  </table>
</div>

<div id="pcopy"></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>(Number(n)||0).toFixed(2);
const DEF='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e8420a"/><rect x="18" y="12" width="28" height="40" rx="3" fill="#fff"/><rect x="22" y="18" width="20" height="6" fill="#5aa7d6"/><rect x="22" y="28" width="20" height="3" fill="#244a8f"/><rect x="22" y="34" width="20" height="3" fill="#244a8f"/><rect x="22" y="40" width="20" height="3" fill="#244a8f"/></svg>');

function ta(v,cls,ph){const t=document.createElement('textarea');t.className='f '+(cls||'');t.rows=1;t.value=v||'';t.placeholder=ph||'';t.addEventListener('input',()=>grow(t));setTimeout(()=>grow(t),0);return t}
function grow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function inp(v,cls){const i=document.createElement('input');i.className='f '+cls;i.value=v||'';i.addEventListener('input',calc);return i}

function addRow(d={}){
  const tr=document.createElement('tr');tr.className='r';
  const c1=document.createElement('td');
  c1.append(ta(d.t,'t','Item title'),ta(d.n,'sm','Details (shop, phone, route…)'));
  const x=document.createElement('button');x.className='x';x.textContent='Remove item';x.onclick=()=>{tr.remove();calc()};c1.append(x);
  const c2=document.createElement('td');c2.className='c';c2.append(inp(d.q,'q'));
  const c3=document.createElement('td');c3.className='c';c3.append(inp(d.r,'rt'),inp(d.r2,'rt sm'));
  const c4=document.createElement('td');c4.className='a';c4.append(inp(d.a,'am'),inp(d.an,'am sm'));
  tr.append(c1,c2,c3,c4);$('rows').append(tr);calc();
}
function calc(){
  let s=0;document.querySelectorAll('#rows tr').forEach(tr=>{s+=parseFloat(tr.querySelector('td:last-child input').value)||0});
  const adv=parseFloat($('adv').value)||0;
  $('total').textContent=fmt(s);$('paid').textContent=fmt(s);$('ret').textContent=fmt(Math.max(adv-s,0));
}
$('adv').addEventListener('input',calc);

addRow({t:'Jersy Print Both side',n:'\nLucky Printers (Tongi Bajar)\n01904-719822',q:'20',r:'90.00',r2:'(2000.00)',a:'1000.00',an:'(Advance)'});
addRow({t:'Travel fare (× 2)',n:'\nSumoner tek To Kamarpara\nKamarpara to Station road\nStation road To Tongi bazar\nTongi bazar to Satation road\nSatation road To Kamarpara\nKamarpara To Sumoner tek',q:'06',r:'****',r2:'',a:'140.00',an:''});

// logo
function setLogo(src){$('logo').src=src}
let saved=null;try{saved=localStorage.getItem('voucher-logo')}catch(e){}
setLogo(saved||DEF);
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{setLogo(r.result);try{localStorage.setItem('voucher-logo',r.result)}catch(e){}};r.readAsDataURL(f);e.target.value=''};
$('logo').onclick=()=>$('file').click();

// menu
const menu=$('menu');
$('dots').onclick=e=>{e.stopPropagation();menu.classList.toggle('on')};
document.addEventListener('click',()=>menu.classList.remove('on'));
$('mLogo').onclick=()=>$('file').click();
$('mDel').onclick=()=>{setLogo(DEF);try{localStorage.removeItem('voucher-logo')}catch(e){}};
$('mAdd').onclick=()=>addRow();
$('add').onclick=()=>addRow();
const dlg=$('pdlg');
function openPrint(){dlg.classList.add('on')}
$('mPrint').onclick=openPrint;$('pbtn').onclick=openPrint;
$('pcancel').onclick=()=>dlg.classList.remove('on');
dlg.onclick=e=>{if(e.target===dlg)dlg.classList.remove('on')};
function clean(){$('pcopy').innerHTML='';document.body.classList.remove('pc')}
window.addEventListener('afterprint',clean);
$('pgo').onclick=()=>{
  dlg.classList.remove('on');clean();
  $('pstyle').textContent='@page{size:'+$('psize').value+' portrait;margin:10mm}';
  if($('pcopies').value==='2'){
    const src=document.querySelector('.sheet');
    ['Office copy','Party copy'].forEach(n=>{
      const c=src.cloneNode(true);
      const live=[...src.querySelectorAll('input,textarea')],cl=[...c.querySelectorAll('input,textarea')];
      cl.forEach((el,i)=>{const s=document.createElement('span');s.className=el.className+' pv';s.textContent=live[i].value;el.replaceWith(s)});
      c.querySelectorAll('.x').forEach(x=>x.closest('button').remove());
      c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
      const tag=document.createElement('div');tag.className='ctag';tag.textContent=n;c.prepend(tag);
      $('pcopy').append(c);
    });
    document.body.classList.add('pc');
  }
  setTimeout(()=>window.print(),150);
};
</script>
</body>
</html>
